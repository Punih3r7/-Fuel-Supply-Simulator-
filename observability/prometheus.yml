global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fuel-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /metrics

  - job_name: 'fuel-simulator'
    static_configs:
      - targets: ['simulator:8000']
    metrics_path: /metrics
