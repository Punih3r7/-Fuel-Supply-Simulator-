services:

  # -------------------------------------------------------------------------
  # BUP Fuel Supply Simulator (organizer-provided)
  # -------------------------------------------------------------------------
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-15}
      TICK_MINUTES: ${TICK_MINUTES:-8}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MCP Server — wraps simulator as Claude tools (Day 1)
  # -------------------------------------------------------------------------
  mcp-server:
    build: ./mcp-server
    environment:
      SIMULATOR_URL: http://simulator:8000
    ports:
      - "8001:8001"
    depends_on:
      simulator:
        condition: service_healthy

