name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd mcp-server
          pip install pytest httpx fastmcp

      - name: Run smoke tests
        run: |
          cd mcp-server
          pytest tests/test_tools.py -v

  backend-check:
    name: Backend Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy psycopg2-binary redis httpx

      - name: Check all modules import
        run: |
          cd backend
          python3 -c "
          from resilience.circuit_breaker import circuit_breaker
          from resilience.fallback import with_fallback
          from cache.redis_cache import get_cache, set_cache
          from db.models import Decision, Alert
          from api.health import router
          print('all backend modules OK')
          "

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          cd frontend
          npm install
          npm run build
